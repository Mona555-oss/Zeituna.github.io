<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeituna App</title>
    <style>
        /* Ensures the app covers the entire browser window */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #FFFBF0; /* Matches your app's background */
        }

        /* The container where Compose will draw the UI */
        #compose-receiver {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Compose Multiplatform looks for this ID to render the app -->
    <div id="compose-receiver"></div>

    <!-- This script loads your Kotlin/Wasm logic -->
    <script src="webApp.js"></script>
</body>
</html>
